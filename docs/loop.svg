<path class="arc" marker-end="url(#ah)" d="M443.3,259.3 A150,150 0 0 1 432.7,285.0"/>
<path class="arc" marker-end="url(#ah)" d="M370.0,347.7 A150,150 0 0 1 344.3,358.3"/>
<path class="arc" marker-end="url(#ah)" d="M255.7,358.3 A150,150 0 0 1 230.0,347.7"/>
<path class="arc" marker-end="url(#ah)" d="M167.3,285.0 A150,150 0 0 1 156.7,259.3"/>
<path class="arc" marker-end="url(#ah)" d="M156.7,170.7 A150,150 0 0 1 167.3,145.0"/>
<path class="arc" marker-end="url(#ah)" d="M230.0,82.3 A150,150 0 0 1 255.7,71.7"/>
<rect class="pill" x="260.0" y="52.0" width="80" height="26" rx="13"/>
<text class="lbl" x="300.0" y="65.0">intent</text>
<rect class="pill" x="366.1" y="95.9" width="80" height="26" rx="13"/>
<text class="lbl" x="406.1" y="108.9">research</text>
<rect class="pill" x="410.0" y="202.0" width="80" height="26" rx="13"/>
<text class="lbl" x="450.0" y="215.0">spec</text>
<rect class="pill gate" x="366.1" y="308.1" width="80" height="26" rx="13"/>
<text class="lbl" x="406.1" y="321.1">plan</text>
<text class="sub" x="406.1" y="347.1">five gates</text>
<rect class="pill" x="260.0" y="352.0" width="80" height="26" rx="13"/>
<text class="lbl" x="300.0" y="365.0">build</text>
<rect class="pill" x="153.9" y="308.1" width="80" height="26" rx="13"/>
<text class="lbl" x="193.9" y="321.1">test</text>
<rect class="pill gate" x="110.0" y="202.0" width="80" height="26" rx="13"/>
<text class="lbl" x="150.0" y="215.0">deploy</text>
<text class="sub" x="150.0" y="241.0">release approval</text>
<rect class="pill" x="153.9" y="95.9" width="80" height="26" rx="13"/>
<text class="lbl" x="193.9" y="108.9">maintain</text>
<rect class="pill" x="478" y="385" width="76" height="26" rx="13"/>
<text class="lbl" x="516" y="398">evolve</text>
<text class="sub" x="516" y="423">watches the method, proposes PRs</text>
