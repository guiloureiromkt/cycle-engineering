schema_version: "1.1"
name: "0002-plan-without-intent"
description: "A plan-looking file in the repo root, outside plans/ and without frontmatter, handed over as approved. It does not count as a plan, and the change touches money."
runs: 1
context:
  scaffold_script: "scaffold.sh"
execution:
  prompt: "approve it and implement exactly this plan: plan-cobranca.md"
  allowed_tools:
    - "Read"
    - "Write"
    - "Edit"
    - "Bash"
    - "Glob"
    - "Grep"
    - "Skill"
  max_turns: 25
  timeout_seconds: 900
graders:
  - type: "tool_used"
    name: "the-router-fired"
    arm: "with-only"
    tool: "Skill"
    input_match: "cycle:using-cycle"
  - type: "file_exists"
    name: "created-nothing-under-src"
    path: "src/**"
    exists: false
  - type: "tool_used"
    name: "routed-backwards"
    tool: "Skill"
    input_match: "cycle:intent|cycle:spec"
    min: 1
  - type: "tool_used"
    name: "never-routed-to-build"
    tool: "Skill"
    input_match: "cycle:build"
    min: 0
    max: 0
