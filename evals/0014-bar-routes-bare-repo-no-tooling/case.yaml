schema_version: "1.1"
name: "0014-bar-routes-bare-repo-no-tooling"
description: "A repo with no manifest, no linter, no test runner, no CI — just shell scripts run by hand. Nothing should be invented as Enforced against tooling that does not exist."
runs: 1
context:
  scaffold_script: "scaffold.sh"
execution:
  prompt: "Set up CONSTRAINTS.md for this repo."
  allowed_tools:
    - "Read"
    - "Write"
    - "Edit"
    - "Bash"
    - "Glob"
    - "Grep"
    - "Skill"
  max_turns: 25
  timeout_seconds: 900
graders:
  - type: "file_exists"
    name: "wrote-constraints-md"
    path: "CONSTRAINTS.md"
  - type: "llm"
    name: "nothing-invented-against-absent-tooling"
    focus:
      source: "file"
      path: "CONSTRAINTS.md"
    criteria: |
      This is the CONSTRAINTS.md that cycle:constraints wrote for a repo with no package manifest, no
      linter, no test runner and no CI — only hand-run shell scripts.

      PASS only if the "Enforced with numbers" table has no row naming a dimension this repo has no
      tool for — every dimension is either omitted or routed to "Measured, not yet enforced" instead.

      FAIL if any Enforced row names a checker or a number the repo has nothing to back it with.
      (Whether Step 0's report said plainly that nothing was detected happens in the chat, not in
      this file — see case.meta.md.)
