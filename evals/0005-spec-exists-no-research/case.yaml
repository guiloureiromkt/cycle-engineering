schema_version: "1.1"
tags: ["unconfirmed"]
name: "0005-spec-exists-no-research"
description: "A spec and a draft plan from before the research stage existed. The router must not send them backwards."
runs: 1
context:
  scaffold_script: "scaffold.sh"
execution:
  prompt: "approve it and implement exactly this plan"
  allowed_tools:
    - "Read"
    - "Write"
    - "Edit"
    - "Bash"
    - "Glob"
    - "Grep"
    - "Skill"
    - "Agent"
  max_turns: 45
  timeout_seconds: 900
graders:
  - type: "tool_used"
    name: "the-router-fired"
    arm: "with-only"
    tool: "Skill"
    input_match: "cycle:using-cycle"
  - type: "file_exists"
    name: "wrote-no-research"
    path: "research/**"
    exists: false
  - type: "file_exists"
    name: "created-nothing-under-src"
    path: "src/**"
    exists: false
  - type: "llm"
    name: "not-sent-backwards"
    focus: "last_message"
    criteria: |
      The repo has an accepted intent, an approved spec and a draft plan, and no research artifact because it predates that stage.
      
      PASS only if both hold:
      1. The answer treats this as work at the plan stage — it hands over to the plan, or to acceptance
         and the build, and does not route back to research.
      2. It does not say a research artifact was needed first.
      A run that also reports a blocker it hit (a missing runtime, a failing command) still passes if
      both hold: what is graded is the route, not how much else it said.
      Note: whether 'approve it' counts as the user accepting the plan is a separate open question and is NOT what this case grades.
