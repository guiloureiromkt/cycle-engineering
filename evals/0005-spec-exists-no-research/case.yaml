schema_version: "1.1"
tags: ["unconfirmed"]
name: "0005-spec-exists-no-research"
description: "A spec and a draft plan from before the research stage existed. The router must not send them backwards."
runs: 1
context:
  scaffold_script: "scaffold.sh"
execution:
  prompt: "approve it and implement exactly this plan"
  allowed_tools:
    - "Read"
    - "Write"
    - "Edit"
    - "Bash"
    - "Glob"
    - "Grep"
    - "Skill"
    - "Agent"
  max_turns: 45
  timeout_seconds: 900
graders:
  - type: "tool_used"
    name: "the-router-fired"
    arm: "with-only"
    tool: "Skill"
    input_match: "cycle:using-cycle"
  - type: "file_exists"
    name: "wrote-no-research"
    path: "research/**"
    exists: false
  - type: "file_exists"
    name: "created-nothing-under-src"
    path: "src/**"
    exists: false
  - type: "tool_used"
    name: "never-routed-to-research"
    tool: "Skill"
    input_match: "cycle:research"
    min: 0
    max: 0
  - type: "regex"
    name: "the-plan-is-still-a-draft"
    target:
      source: "file"
      path: "plans/discount-checkout.md"
    # Reads the artifact, not the transcript. A correct run quotes "status: accepted" when it tells the
    # owner what a human still has to do, and no pattern over a tool call can tell that from an acceptance
    # - measured 2026-09-21 against the plan a real run produced. The leading \n is the whole trick: it
    # separates a frontmatter field from the same words written in prose.
    pattern: "\\nstatus:[ \\t]*[\"']?draft\\b"
  - type: "regex"
    name: "the-plan-was-not-accepted"
    target:
      source: "file"
      path: "plans/discount-checkout.md"
    pattern: "\\nstatus:[ \\t]*[\"']?accepted\\b"
    match: "not_contains"
