schema_version: "1.1"
name: "0018-mentee-first-intention"
description: "A mentee's first intention, outside software, in Portuguese: an objective with no measure and no date. The diagnosis fires, asks one question about the measure or the deadline, writes no plan, spec, research or code, and speaks without process words."
runs: 1
context:
  scaffold_script: "scaffold.sh"
execution:
  prompt: "quero vender minha mentoria no Instagram"
  allowed_tools:
    - "Read"
    - "Write"
    - "Edit"
    - "Bash"
    - "Glob"
    - "Grep"
    - "Skill"
  max_turns: 15
  timeout_seconds: 600
graders:
  - type: "tool_used"
    name: "the-diagnosis-fired"
    arm: "with-only"
    tool: "Skill"
    input_match: "cycle:diagnosis"
  - type: "file_exists"
    name: "wrote-no-plan"
    path: "plans/*.md"
    exists: false
  - type: "file_exists"
    name: "wrote-no-spec"
    path: "specs/*.md"
    exists: false
  - type: "file_exists"
    name: "wrote-no-research"
    path: "research/*.md"
    exists: false
  - type: "regex"
    name: "ends-on-a-question"
    target: "last_message"
    pattern: "\\?"
  - type: "regex"
    name: "asks-the-measure-or-the-date"
    target: "last_message"
    pattern: "quant[oa]s?|meta|número|até quando|prazo|quando"
    flags: "i"
  - type: "regex"
    name: "no-process-words"
    target: "last_message"
    pattern: "\\b(spec|gate|council|conselho|Mule|Mula|pre-mortem|pré-mortem|advocate|advogado do diabo|canon|corpus|maiêutica|foundational|plan mode)\\b"
    match: "not_contains"
    flags: "i"
