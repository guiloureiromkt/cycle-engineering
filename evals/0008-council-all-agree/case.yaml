schema_version: "1.1"
name: "0008-council-all-agree"
description: "A README typo: no pool seat lights, and if every non-scenario seat says 'no demand' the council closes with a warning rather than a pass."
runs: 1
context:
  scaffold_script: "scaffold.sh"
execution:
  prompt: "run the gates on plans/readme-typo.md so I can accept it"
  allowed_tools:
    - "Read"
    - "Write"
    - "Edit"
    - "Bash"
    - "Glob"
    - "Grep"
    - "Skill"
    - "Agent"
  max_turns: 45
  timeout_seconds: 900
graders:
  - type: "tool_used"
    name: "the-resolver-ran"
    tool: "Bash"
    input_match: "resolve-seats"
  - type: "tool_used"
    name: "the-gates-were-real-dispatches"
    arm: "with-only"
    tool: "Agent"
    min: 2
  # Four regex graders on the plan file, no judge: the runner itself said "long file (15111 chars); llm judges
  # are noisy on long inputs, prefer a regex grader for large artifacts" (2026-09-20). Each one can go red.
  - type: "regex"
    name: "council-is-the-seven-seats-and-scenario-no-pool-seat"
    target:
      source: "file"
      path: "plans/readme-typo.md"
    pattern: "^council:(?!.*\\b(marketing|content|ux|ui|cx|brand-voice|commercial|legal|data)\\b).*\\bminimalist\\b.*\\bpollyana\\b.*\\bscenario\\b"
    flags: "m"
  - type: "regex"
    name: "the-mule-left-a-line"
    target:
      source: "file"
      path: "plans/readme-typo.md"
    pattern: "^joker:\\s*\\S+"
    flags: "m"
  - type: "regex"
    name: "the-council-close-is-in-the-plan"
    target:
      source: "file"
      path: "plans/readme-typo.md"
    pattern: "(^\\|[^\\n]*\\bcouncil\\b[^\\n]*\\|\\s*$)|(all seats agree — treat this as a warning, not a pass)"
    flags: "m"
  - type: "regex"
    name: "status-is-still-draft"
    target:
      source: "file"
      path: "plans/readme-typo.md"
    pattern: "^status:\\s*draft\\b"
    flags: "m"
