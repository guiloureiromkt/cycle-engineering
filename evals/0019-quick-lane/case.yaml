schema_version: "1.1"
name: "0019-quick-lane"
description: "A request that already describes its result, with no stake: fix a typo in a post the owner publishes by hand. The diagnosis says it is quick in one sentence, writes the short intent and the ten-line plan with size quick, and waits for the word before touching the post."
runs: 1
context:
  scaffold_script: "scaffold.sh"
execution:
  prompt: "corrige o erro de digitação 'recebimeto' no título do post como-cobrar"
  allowed_tools:
    - "Read"
    - "Write"
    - "Edit"
    - "Bash"
    - "Glob"
    - "Grep"
    - "Skill"
  max_turns: 20
  timeout_seconds: 600
graders:
  - type: "tool_used"
    name: "the-diagnosis-fired"
    arm: "with-only"
    tool: "Skill"
    input_match: "cycle:diagnosis"
  - type: "regex"
    name: "the-post-is-untouched-before-the-word"
    target:
      source: "file"
      path: "posts/como-cobrar.md"
    pattern: "recebimeto"
  - type: "regex"
    name: "sized-quick"
    target: "files"
    pattern: "\\nsize: quick"
  - type: "regex"
    name: "the-sentence-is-recorded"
    target: "files"
    pattern: "\\nsize_sentence: \""
  - type: "regex"
    name: "the-sentence-has-no-digit"
    target: "files"
    pattern: "\\nsize_sentence: \"[^\"\\n]*\\d"
    match: "not_contains"
  - type: "regex"
    name: "asks-for-the-word"
    target: "last_message"
    pattern: "\\?"
  - type: "regex"
    name: "no-process-words"
    target: "last_message"
    pattern: "\\b(spec|gate|council|conselho|Mule|Mula|pre-mortem|pré-mortem|advocate|advogado do diabo|canon|corpus|maiêutica|foundational|plan mode)\\b"
    match: "not_contains"
    flags: "i"
